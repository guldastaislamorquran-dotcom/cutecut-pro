name: cutecut-pro
base: core22
version: '2.3.9'
summary: CuteCut Pro Professional Video Editor Suite
description: |
  CuteCut Pro is a high-performance, studio-grade video editing suite
  engineered for desktop and cloud workflows, featuring advanced Quran AI
  subtitling, multi-track audio/video composition, keyframing, and professional transitions.

grade: stable
confinement: strict

apps:
  cutecut-pro:
    command: cutecut-pro --no-sandbox --disable-gpu-sandbox --ozone-platform-hint=auto
    extensions: [gnome]
    plugs: [desktop, desktop-legacy, wayland, x11, opengl, audio-playback, home]

parts:
  desktop-gtk3:
    plugin: nil
    stage-packages:
      # Core NSS/NSPR for SSL/TLS
      - libnspr4
      - libnss3
      
      # ATK (Accessibility Toolkit) - REQUIRED for GTK3
      - libatk1.0-0
      - libatk-bridge2.0-0
      
      # Core GTK3 libraries
      - libgtk-3-0
      - libgdk-pixbuf-2.0-0
      - libglib2.0-0
      - libgobject-2.0-0
      
      # GObject introspection
      - libgirepository1.0-1
      
      # Pango (text rendering for GTK)
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libpangoft2-1.0-0
      
      # Cairo (graphics)
      - libcairo2
      - libcairo-gobject2
      
      # Freetype and font support
      - libfreetype6
      - libfontconfig1
      - fonts-liberation
      - fonts-dejavu-core
      
      # Pixman (pixel manipulation)
      - libpixman-1-0
      
      # X11 and Wayland support
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcb-render0
      - libxcb-shm0
      - libxext6
      - libxinerama1
      - libxrandr2
      - libxcomposite1
      - libxcursor1
      - libxdamage1
      - libxfixes3
      - wayland-protocols
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      
      # DRI and GPU support
      - libdrm2
      - libgbm1
      - libgl1-mesa-glx
      - libglx0
      - libxext6
      - libxdamage1
      - libxfixes3
      
      # Audio support
      - libasound2
      - pulseaudio-libs
      
      # Cups for printing
      - libcups2
      
      # Desktop utilities
      - desktop-file-utils
      - shared-mime-types
      - gsettings-desktop-schemas
      - dconf-gsettings-backend
      - libdconf1
      
      # Additional compression/archive support
      - zlib1g
      - libbz2-1.0
      - libssl3
      
      # dbus (system communication)
      - libdbus-1-3
      
      # libc and system basics
      - libc6
      - libgcc1
      - libstdc++6
